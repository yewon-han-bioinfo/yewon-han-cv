bio: |
  Yewon Han is a graduate student researcher in the Integrated M.S./Ph.D. Program
  of the Interdisciplinary Program of Bioinformatics at Seoul National University,
  working with Prof. Martin Steinegger. Yewon's research focuses on method development
  and data science for large-scale protein structure prediction and analysis, as
  part of collaborative efforts to build open-access biological resources such as
  the AlphaFold Database.

